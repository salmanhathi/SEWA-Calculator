<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEWA Bill Tracker</title>
<meta name="theme-color" content="#0F1713">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; font-src 'self'; form-action 'none'; base-uri 'self'">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <div class="brand"><span class="dot"></span>SEWA Tracker</div>
  <div class="subline">nothing leaves this device</div>
</header>

<nav class="tab-bar">
  <button class="tab-btn active" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Dashboard</span></button>
  <button class="tab-btn" data-view="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg><span>Add Bill</span></button>
  <button class="tab-btn" data-view="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>History</span></button>
  <button class="tab-btn" data-view="municipality"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21V8l8-5 8 5v13M9 21v-6h6v6"/></svg><span>Municipality</span></button>
  <button class="tab-btn" data-view="backup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg><span>Backup</span></button>
</nav>

<main class="app-main">
  <section class="view" id="view-dashboard"></section>
  <section class="view" id="view-add"></section>
  <section class="view" id="view-history"></section>
  <section class="view" id="view-municipality"></section>
  <section class="view" id="view-backup"></section>
</main>
<div class="toast" id="toast"></div>

<script src="lib/pdf.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script src="parser.js"></script>
<script src="app.js"></script>
</body>
</html>
